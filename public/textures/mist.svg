<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- Original procedural artwork: static noise breaks long curved banks into
       translucent wisps. CSS moves the cached image, not this filter. -->
  <defs>
    <filter id="cloud" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .014" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .61  0 0 0 0 .66  0 0 0 0 .63  0 3.6 0 0 -1.5"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="curl" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .018" numOctaves="2" seed="19" result="flow"/>
      <feDisplacementMap in="SourceGraphic" in2="flow" scale="85" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <linearGradient id="edges">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".12" stop-color="white"/>
      <stop offset=".88" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="banks">
      <g fill="none" stroke="white" filter="url(#curl)">
        <path d="M-100 400 C100 460 200 145 430 255 S710 440 900 225 S1160 100 1330 170" stroke-width="150"/>
        <path d="M-60 220 C180 80 300 450 565 340 S870 75 1260 390" stroke-width="75" stroke-opacity=".65"/>
        <path d="M10 480 C285 320 410 530 660 400 S970 350 1200 470" stroke-width="42" stroke-opacity=".45"/>
      </g>
    </mask>
    <mask id="tile-edges"><path fill="url(#edges)" d="M0 0h1200v600H0z"/></mask>
  </defs>
  <g mask="url(#tile-edges)">
    <path d="M0 0h1200v600H0z" fill="#9ca8a1" filter="url(#cloud)" mask="url(#banks)"/>
  </g>
</svg>
